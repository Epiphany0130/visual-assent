server:
  port: 8123 # 服务端口
  servlet:
    context-path: /api # 项目访问路径前缀
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000 # 30 天的秒数
spring:
  profiles:
    active: local # 激活的配置文件
  application:
    name: visual-assent # 应用名称
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # 数据库驱动类名
    url: ${DB_URL} # 数据库连接URL
    username: ${DB_USERNAME} # 数据库用户名
    password: ${DB_PASSWORD} # 数据库密码
  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB
  # redis 配置
  data:
    redis:
      database: 0
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 5000
  # session 配置
  session:
    # session 30 天过期
    timeout: 2592000 # 30 天的秒数
  # spring ai 配置
  ai:
    openai:
      api-key: ${MIMO_API_KEY}
      base-url: ${MIMO_BASE_URL}
      chat:
        completions-path: ${MIMO_CHAT_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${MIMO_MODEL}
          temperature: 0.1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false # 驼峰命名转换(关闭)
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # SQL日志输出到控制台
  global-config:
    db-config:
      logic-delete-field: isDelete # 逻辑删除字段名
      logic-delete-value: 1 # 已删除值
      logic-not-delete-value: 0 # 未删除值

# springdoc-openapi 配置
springdoc:
  group-configs:
    - group: 'default' # API分组名称
      paths-to-match: '/**' # 匹配所有路径
      packages-to-scan: com.guyuqi.backend.controller # 扫描控制器包路径

# knife4j 增强配置
knife4j:
  enable: true # 启用Knife4j增强功能
  setting:
    language: zh_cn # 设置界面语言为中文

# 腾讯混元生图配置
tencent:
  image:
    submit-url: https://tokenhub.tencentmaas.com/v1/api/image/submit
    query-url: https://tokenhub.tencentmaas.com/v1/api/image/query
    api-key: ${TENCENT_IMAGE_API_KEY}
    model: hy-image-v3.0

# 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: ${COS_HOST}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET}
    datasetName: ${COS_DATASET_NAME}
